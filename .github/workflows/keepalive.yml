name: keepalive-painel
# Mantém o painel de produção (Render free) acordado — sem isso ele hiberna
# após 15 min ocioso e a primeira abertura leva ~1 min.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 30 https://fervo-producao.onrender.com/healthz
